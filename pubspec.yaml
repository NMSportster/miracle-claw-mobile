name: miracle_claw_mobile
description: "Miracle Claw mobile companion — Android + iOS chat client for MAIC + paired desktop gateway"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # HTTP + SSE
  dio: ^5.7.0

  # Local persistence
  drift: ^2.20.2
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure storage for JWTs (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Biometric re-auth gate
  local_auth: ^2.3.0

  # QR pairing (Phase 3 — declared now so it's available)
  mobile_scanner: ^5.2.3

  # Voice input (Phase 2 — declared now so it's available)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

  # Markdown rendering for chat bubbles (Phase 2 polish)
  flutter_markdown: ^0.7.4

  # Background sync (Phase 2 — declared when we wire it up)
  # workmanager: ^0.5.2
  connectivity_plus: ^6.0.5

  # Pairing service (Phase 3)
  device_info_plus: ^12.4.0
  uuid: ^4.5.1

  # Models / serialization
  # Mobile-desktop pairing (Phase 3). Maintained by terrier989/dint-dev.
  # X25519 + AES-GCM + HKDF + HMAC + Argon2id in one family. Native backends
  # via Apple CryptoKit + Android javax.crypto (50x faster than pure-Dart
  # fallback). Single dependency for the entire pairing crypto path.
  # Spec: docs/specs/mobile-desktop-pairing-spike.md.
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  collection: ^1.18.0
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
